plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ffkit.lite'
    compileSdk 34
    defaultConfig {
        applicationId "com.ffkit.lite"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion "1.5.14" }
    kotlinOptions { jvmTarget = "17" }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake { path "../native/CMakeLists.txt"; version "3.22.1" }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    // VA desligado nesta build — stubs locais em com.lody.virtual.*
    // Xposed API: stubs locais em de.robv.android.xposed.*

    // ML Kit — pose detection (modelo via Play Services, 0 MB no APK)
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-compose:1.9.2"
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
}
